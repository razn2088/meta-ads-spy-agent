<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alto Dashboard Explainer</title>
<link rel="stylesheet" href="fonts/heebo.css">
<style>
:root{
  --n950:#030A1C; --n900:#061433; --n800:#0A1E4A; --n700:#123070; --n600:#1B3F8C;
  --b500:#2E6BFF; --b400:#4F86FF; --b300:#8DB0FF; --b100:#DCE7FF;
  --w:#FFFFFF; --mist:#EEF3FC; --line:#D5DFF0; --ink:#0A1E4A; --muted:#5C6F93;
  --ok:#22C77A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--n950);overflow:hidden}
body{font-family:'Heebo',system-ui,sans-serif;color:var(--w);-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;flex:none;transform-origin:center;background:var(--n900)}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.scene-bg{position:absolute;inset:0}
.navy .scene-bg{background:radial-gradient(1200px 800px at 75% 20%, #0F2A66 0%, rgba(15,42,102,0) 60%),linear-gradient(160deg,var(--n800) 0%,var(--n900) 55%,var(--n950) 100%)}
.navy .scene-bg::after{content:"";position:absolute;inset:-40px;background-image:radial-gradient(rgba(141,176,255,.16) 1.4px, transparent 1.6px);background-size:40px 40px;transform:translate(var(--gx,0),var(--gy,0))}
.white .scene-bg{background:linear-gradient(180deg,#FFFFFF 0%,#F3F6FC 100%)}
.white{color:var(--ink)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.orb.a{width:620px;height:620px;background:#1F56E0}
.orb.b{width:520px;height:520px;background:#0E3CA8;opacity:.6}
.wipe-edge{position:absolute;top:0;bottom:0;width:18px;background:linear-gradient(180deg,var(--b400),var(--b500));box-shadow:0 0 40px 6px rgba(46,107,255,.6);display:none;z-index:50}
.content{position:absolute;inset:0}
.mask{overflow:hidden;display:block;padding-bottom:.08em}
.mask>span{display:inline-block}
.kicker{display:inline-flex;align-items:center;gap:12px;white-space:nowrap;font-size:26px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--b300)}
.white .kicker{color:var(--b500)}
.kicker::before{content:"";width:34px;height:4px;border-radius:2px;background:currentColor}
html[lang=he] .kicker{letter-spacing:.02em}
.accent{color:var(--b400)}
.white .accent{color:var(--b500)}

/* watermark */
.wm{position:absolute;top:48px;left:64px;display:flex;align-items:center;gap:14px;z-index:20;direction:ltr}
.wm svg{width:44px;height:44px}
.wm b{font-size:28px;font-weight:900;letter-spacing:.18em}
.white .wm{color:var(--ink)}
html[dir=rtl] .wm{left:auto;right:64px}
html[dir=rtl] .wm{left:auto;right:64px}

/* ---------- S1 intro ---------- */
#s1 .content{display:flex;flex-direction:column;align-items:center;justify-content:center}
.lockup{display:flex;align-items:center;gap:48px;direction:ltr}
.mark{width:220px;height:220px;overflow:visible}
.mark path,.mark rect{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
.word{display:flex;font-size:230px;font-weight:900;letter-spacing:.06em;line-height:1;overflow:hidden;padding:0 .02em .04em}
.word span{display:inline-block}
#s1 .tag{margin-top:46px;font-size:44px;font-weight:500;color:var(--b100);letter-spacing:.04em}
#s1 .bar{margin-top:30px;height:6px;width:520px;border-radius:3px;background:linear-gradient(90deg,var(--b500),var(--b300));transform-origin:center}

/* ---------- S2 problem ---------- */
#s2 .head{position:absolute;top:290px;inset-inline-start:130px;width:900px;white-space:nowrap}
#s2 h1{font-size:92px;line-height:1.06;font-weight:800}
#s2 .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
#s2 .q h1{font-size:150px;font-weight:900;line-height:1}
#s2 .q .uline{height:10px;width:640px;margin-top:28px;border-radius:5px;background:var(--b500);transform-origin:left}
html[dir=rtl] #s2 .q .uline{transform-origin:right}
.adcard{position:absolute;width:280px;background:#fff;border-radius:22px;color:var(--ink);box-shadow:0 30px 60px rgba(0,0,0,.35);overflow:visible;padding:16px}
.adcard .h{display:flex;align-items:center;gap:10px}
.adcard .av{width:40px;height:40px;border-radius:50%;flex:none}
.adcard .nm{font-weight:700;font-size:18px;line-height:1.1}
.adcard .sp{font-size:13px;color:var(--muted)}
.adcard .media{margin-top:12px;height:170px;border-radius:14px;position:relative;overflow:hidden}
.adcard .media .play{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.9)}
.adcard .media .play::after{content:"";position:absolute;left:22px;top:17px;border-left:18px solid var(--ink);border-top:11px solid transparent;border-bottom:11px solid transparent}
.adcard .ln{height:10px;border-radius:5px;background:#E3E9F4;margin-top:12px}
.adcard .cta{margin-top:14px;height:40px;border-radius:10px;background:var(--mist);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--b500)}
.adcard .new{position:absolute;top:-16px;inset-inline-end:-14px;background:var(--b500);color:#fff;font-weight:800;font-size:17px;letter-spacing:.08em;padding:7px 14px;border-radius:999px;box-shadow:0 8px 20px rgba(46,107,255,.5)}

/* ---------- S3 introducing ---------- */
#s3 .content{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#s3 h1{font-size:150px;font-weight:900;line-height:1;margin-top:26px}
#s3 .sub{font-size:44px;color:var(--b100);margin-top:30px;font-weight:400}
#s3 .ring{position:absolute;left:50%;top:50%;width:1100px;height:1100px;margin:-550px 0 0 -550px;border-radius:50%;border:2px solid rgba(141,176,255,.18)}
#s3 .ring.r2{width:1500px;height:1500px;margin:-750px 0 0 -750px;border-color:rgba(141,176,255,.10)}
.pills{display:flex;gap:28px;margin-top:70px}
.pill{display:flex;align-items:center;gap:18px;padding:22px 34px 22px 24px;border-radius:999px;background:rgba(255,255,255,.08);border:1.5px solid rgba(141,176,255,.35);font-size:30px;font-weight:600}
html[dir=rtl] .pill{padding:22px 24px 22px 34px}
.pill .ic{width:56px;height:56px;border-radius:50%;background:var(--b500);display:flex;align-items:center;justify-content:center;flex:none}
.pill svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ---------- S4 how it works ---------- */
#s4 .top{position:absolute;top:150px;left:0;right:0;text-align:center}
#s4 h2{font-size:92px;font-weight:900;margin-top:14px;line-height:1}
#s4 .steps{position:absolute;top:410px;left:0;right:0;display:flex;justify-content:center;gap:90px}
.step{position:relative;width:470px;height:470px;border-radius:32px;background:#fff;border:2px solid var(--line);padding:44px 40px;box-shadow:0 24px 50px rgba(10,30,74,.08)}
.step .ring{position:absolute;inset:-3px;border-radius:34px;border:4px solid var(--b500);box-shadow:0 30px 70px rgba(46,107,255,.28);opacity:0}
.step .num{font-size:30px;font-weight:800;color:var(--b500);letter-spacing:.1em}
.step .ic{width:120px;height:120px;border-radius:30px;background:var(--n800);display:flex;align-items:center;justify-content:center;margin-top:22px;position:relative;overflow:hidden}
.step .ic svg{width:66px;height:66px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.step h3{font-size:44px;font-weight:800;margin-top:34px;line-height:1.1}
.step p{font-size:28px;color:var(--muted);margin-top:16px;line-height:1.35}
#s4 svg.conn{position:absolute;top:0;left:0;width:1920px;height:1080px;overflow:visible;pointer-events:none}
#s4 svg.conn path{fill:none;stroke:var(--b500);stroke-width:5;stroke-linecap:round}

/* ---------- S5 dashboard ---------- */
#s5 .split{position:absolute;inset:0;display:flex;align-items:center;gap:80px;padding:60px 90px 0}
.browser{width:1240px;height:740px;border-radius:22px;background:#F4F7FC;box-shadow:0 50px 100px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);overflow:hidden;flex:none;color:var(--ink);position:relative}
.browser .chrome{height:48px;background:#E6ECF6;display:flex;align-items:center;gap:10px;padding:0 20px;direction:ltr}
.browser .chrome i{width:14px;height:14px;border-radius:50%;background:#C5CFE0;display:block}
.browser .chrome .tab{margin-left:24px;height:34px;align-self:flex-end;background:#F4F7FC;border-radius:10px 10px 0 0;padding:0 22px;display:flex;align-items:center;font-size:15px;font-weight:600;color:var(--ink)}
.dash{padding:26px 30px}
.dash .hd{display:flex;align-items:center;gap:16px}
.dash .hd .lg{width:46px;height:46px;border-radius:12px;background:var(--n800);display:flex;align-items:center;justify-content:center}
.dash .hd .lg svg{width:32px;height:32px}
.dash .hd b{font-size:26px;font-weight:800;display:block;line-height:1.1}
.dash .hd small{font-size:15px;color:var(--muted)}
.dash .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
.card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:20px 22px;box-shadow:0 4px 14px rgba(10,30,74,.05)}
.card h4{font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 22px;border-radius:10px;font-weight:700;font-size:16px;background:var(--b500);color:#fff;white-space:nowrap}
.btn.run{background:var(--n800);min-width:150px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:700}
.badge .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.badge.ok{background:#E2F8EE;color:#0E9A5B}
.badge.run{background:var(--b100);color:var(--b500)}
.status{display:flex;align-items:center;gap:14px;margin-top:16px;font-size:14px;color:var(--muted)}
.pbar{height:8px;border-radius:4px;background:#E6ECF6;margin-top:16px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b500),var(--b400));border-radius:4px}
html[dir=rtl] .pbar i{margin-inline-start:0}
.scan{margin-top:10px;font-size:14px;font-weight:600;color:var(--b500);height:20px;display:flex;align-items:center;gap:8px}
.scan svg{width:18px;height:18px;stroke:#0E9A5B;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.frow{display:flex;gap:10px;margin-top:16px}
.inp{height:42px;border-radius:10px;border:1.5px solid var(--line);background:#FAFBFE;display:flex;align-items:center;padding:0 12px;font-size:15px;color:var(--ink);overflow:hidden;white-space:nowrap;flex:1;min-width:0}
.inp.url{flex:1.5}
.inp .ph{color:#9AA8C2}
.inp.focus{border-color:var(--b500);box-shadow:0 0 0 4px rgba(46,107,255,.15);background:#fff}
.caret{display:inline-block;width:2px;height:20px;background:var(--b500);margin-inline-start:1px;vertical-align:middle}
.comp{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid #EDF1F8;overflow:hidden}
.comp b{font-size:16px;display:block}
.comp small{font-size:13px;color:var(--b500);direction:ltr;display:block;text-align:start}
html[dir=rtl] .comp small{text-align:right}
.comp .rm{font-size:13px;color:#C0392B;font-weight:700;background:#FDECEA;padding:5px 12px;border-radius:8px}
.comp-wrap{overflow:hidden}
.tbl{width:100%;border-collapse:collapse;margin-top:14px;font-size:15px}
.tbl th{font-size:13px;color:var(--muted);text-align:start;font-weight:700;padding:8px 6px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:0 6px;border-bottom:1px solid #EDF1F8;height:50px}
.tbl tr.hl td{background:#F2F6FF}
.tbl td .badge{padding:4px 11px;font-size:13px}
.tbl .n{font-weight:800}
.captions{display:flex;flex-direction:column;gap:46px;flex:1}
.cap{display:flex;align-items:flex-start;gap:24px}
.cap .no{width:64px;height:64px;border-radius:50%;background:var(--b500);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;flex:none}
.cap .tx{font-size:40px;font-weight:700;line-height:1.15;padding-top:6px}

#cursor{position:absolute;left:0;top:0;width:40px;height:40px;z-index:60;display:none;pointer-events:none}
#cursor svg{width:40px;height:40px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.ripple{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:4px solid var(--b500);z-index:59;display:none}

/* ---------- S6 report ---------- */
#s6 .split{position:absolute;inset:0;display:flex;flex-direction:row-reverse;align-items:center;justify-content:center;gap:150px;padding-top:20px}
.phone{width:440px;height:860px;border-radius:64px;background:#020817;padding:16px;box-shadow:0 60px 120px rgba(0,0,0,.6),0 0 0 2px rgba(141,176,255,.25);flex:none;position:relative}
.phone .scr{width:100%;height:100%;border-radius:50px;overflow:hidden;background:#E9EEF6;position:relative;color:var(--ink)}
.phone .notch{position:absolute;top:26px;left:50%;width:120px;height:32px;margin-left:-60px;background:#020817;border-radius:20px;z-index:3}
.chat-h{height:132px;background:var(--n800);display:flex;align-items:flex-end;gap:14px;padding:0 22px 18px;color:#fff}
.chat-h .av{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.chat-h .av svg{width:34px;height:34px}
.chat-h b{display:block;font-size:20px;font-weight:700}
.chat-h small{font-size:14px;color:var(--b300)}
.chat-b{padding:20px 16px;background-image:radial-gradient(rgba(10,30,74,.06) 1.2px,transparent 1.4px);background-size:22px 22px;height:calc(100% - 132px)}
.day{margin:0 auto 16px;width:max-content;font-size:13px;font-weight:700;color:var(--muted);background:#fff;padding:5px 14px;border-radius:8px}
.typing{display:inline-flex;gap:6px;background:#fff;padding:14px 18px;border-radius:18px;border-start-start-radius:4px}
.typing i{width:9px;height:9px;border-radius:50%;background:#9AA8C2;display:block}
.bubble{background:#fff;border-radius:20px;border-start-start-radius:4px;padding:16px 18px 10px;width:370px;box-shadow:0 2px 6px rgba(10,30,74,.08);font-size:16.5px;line-height:1.42}
.bubble .sec{overflow:hidden}
.bubble .sec>div{padding:4px 8px;margin:0 -8px 6px;border-radius:10px}
.bubble .rh{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.bubble .rh svg{width:22px;height:22px;stroke:var(--b500);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bubble .st{font-weight:800;color:var(--b500);font-size:15px;letter-spacing:.02em}
.bubble ul{list-style:none}
.bubble li{position:relative;padding-inline-start:16px}
.bubble li::before{content:"";position:absolute;inset-inline-start:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--b500)}
.bubble .lnk{color:#1D5BEA;text-decoration:underline;direction:ltr;display:block;text-align:start;font-size:15px}
html[dir=rtl] .bubble .lnk{text-align:right}
.bubble .tm{text-align:end;font-size:12px;color:#9AA8C2}
.rcaps{display:flex;flex-direction:column;width:640px}
.rcaps h2{font-size:78px;font-weight:900;line-height:1.02;margin:14px 0 50px}
.rcap{display:flex;align-items:center;gap:22px;padding:18px 0;font-size:36px;font-weight:700;border-top:1.5px solid rgba(141,176,255,.18)}
.rcap .no{width:54px;height:54px;border-radius:14px;background:rgba(46,107,255,.2);color:var(--b300);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;flex:none}

/* ---------- S7 benefits ---------- */
#s7 .top{position:absolute;top:150px;left:0;right:0;text-align:center}
#s7 h2{font-size:100px;font-weight:900;margin-top:14px;line-height:1}
#s7 .tiles{position:absolute;top:430px;left:0;right:0;display:flex;justify-content:center;gap:36px}
.tile{width:388px;height:420px;border-radius:30px;background:var(--n800);color:#fff;padding:42px 36px;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(46,107,255,.35);filter:blur(50px);inset-inline-end:-80px;bottom:-90px}
.tile .ic{width:96px;height:96px;border-radius:26px;background:var(--b500);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:54px;height:54px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tile h3{font-size:37px;font-weight:800;margin-top:38px;line-height:1.08}
.tile p{font-size:27px;color:var(--b100);margin-top:16px;line-height:1.35;position:relative;z-index:1}

/* ---------- S8 outro ---------- */
#s8 .content{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#s8 .lockup .mark{width:150px;height:150px}
#s8 .word{font-size:160px}
#s8 h2{font-size:76px;font-weight:800;margin-top:60px;line-height:1.1}
#s8 .sub{font-size:34px;color:var(--b300);margin-top:22px;font-weight:500}
#fadeout{position:absolute;inset:0;background:var(--n950);opacity:0;z-index:90;pointer-events:none}
#progress{position:absolute;left:0;bottom:0;height:6px;background:var(--b500);z-index:80;width:0}
html[dir=rtl] #progress{left:auto;right:0}
</style>
</head>
<body>
<div id="viewport"><div id="stage">

<!-- shared logo symbol -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="alto-mark" viewBox="0 0 120 120">
      <rect x="6" y="6" width="108" height="108" rx="30" fill="none" stroke="currentColor" stroke-width="8"/>
      <path d="M26 86 L50 50 L62 66 L80 40 L96 86" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="80" cy="26" r="0" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<!-- S1 · Logo intro -->
<section class="scene navy" id="s1" data-start="0" data-end="4.5">
  <div class="scene-bg"></div>
  <div class="content">
    <div class="lockup">
      <svg class="mark" viewBox="0 0 120 120">
        <rect id="m-rect" x="6" y="6" width="108" height="108" rx="30" stroke-width="8"/>
        <path id="m-peak" d="M26 86 L50 50 L62 66 L80 40 L96 86" stroke-width="8"/>
      </svg>
      <div class="word" id="s1-word"><span>A</span><span>L</span><span>T</span><span>O</span></div>
    </div>
    <div class="tag mask"><span data-in="1.5" data-fx="rise" data-t="s1.tag"></span></div>
    <div class="bar" id="s1-bar"></div>
  </div>
</section>

<!-- S2 · The problem -->
<section class="scene navy has-wm" id="s2" data-start="4.5" data-end="11">
  <div class="scene-bg"></div>
  <div class="content">
    <div id="s2-cards"></div>
    <div class="head" id="s2-head">
      <h1><span class="mask"><span data-in="0.35" data-fx="rise" data-t="s2.l1"></span></span>
          <span class="mask"><span data-in="0.55" data-fx="rise" data-t="s2.l2"></span></span>
          <span class="mask"><span data-in="0.75" data-fx="rise" data-t="s2.l3"></span></span>
          <span class="mask"><span class="accent" data-in="1.05" data-fx="rise" data-t="s2.l4"></span></span></h1>
    </div>
    <div class="q" id="s2-q">
      <h1 class="mask"><span data-in="4.35" data-fx="rise" data-t="s2.q"></span></h1>
      <div class="uline" id="s2-uline"></div>
    </div>
  </div>
</section>

<!-- S3 · Introducing -->
<section class="scene navy has-wm" id="s3" data-start="11" data-end="18">
  <div class="scene-bg"></div>
  <div class="content">
    <div class="ring" id="s3-r1"></div><div class="ring r2" id="s3-r2"></div>
    <div class="kicker" data-in="0.4" data-fx="up" data-t="s3.k"></div>
    <h1 class="mask"><span data-in="0.6" data-fx="rise" data-t="s3.title"></span></h1>
    <div class="sub" data-in="1.2" data-fx="up" data-t="s3.sub"></div>

  else if (fx === 'pop') { const p = E.back(raw); o = clamp(raw * 3); tf = `scale(${lerp(.6, 1, p)})`; }
  else if (fx === 'up') { const p = E.out(raw); o = clamp(raw * 1.6); tf = `translateY(${(1 - p) * 50}px)`; }
  else if (fx === 'end') { const p = E.out(raw); o = clamp(raw * 1.6); tf = `translateX(${SX * (1 - p) * 70}px)`; }
  else if (fx === 'start') { const p = E.out(raw); o = clamp(raw * 1.6); tf = `translateX(${-SX * (1 - p) * 70}px)`; }
  else { o = E.out(raw); }
  n.style.opacity = o;
  n.style.transform = tf;
  return raw;
}

function bgMotion(s, t) {
  if (!s.bg) return;
  s.bg.style.setProperty('--gx', `${(t * 6) % 40}px`);
  s.bg.style.setProperty('--gy', `${(t * 3) % 40}px`);
  const a = s.bg.querySelector('.orb.a'), b = s.bg.querySelector('.orb.b');
  if (a) { a.style.left = `${1100 + Math.sin(t * .35) * 260}px`; a.style.top = `${-160 + Math.cos(t * .28) * 140}px`; }
  if (b) { b.style.left = `${-120 + Math.cos(t * .3) * 200}px`; b.style.top = `${560 + Math.sin(t * .42) * 160}px`; }
}

/* ============ per-scene custom animation ============ */
const custom = {};

/* --- S1 --- */
const mRect = $('#m-rect'), mPeak = $('#m-peak');
const RLEN = 381, PLEN = 144; // perimeter of the rounded rect / length of the peak polyline
[mRect, $('#m2-rect')].forEach(r => r.style.strokeDasharray = RLEN);
[mPeak, $('#m2-peak')].forEach(r => r.style.strokeDasharray = PLEN);
function drawLockup(local, rect, peak, word, t0) {
  rect.style.strokeDashoffset = RLEN * (1 - E.inOut(prog(local, t0, t0 + .8)));
  peak.style.strokeDashoffset = PLEN * (1 - E.out(prog(local, t0 + .35, t0 + 1.05)));
  [...word.children].forEach((c, i) => {
    const p = E.out5(prog(local, t0 + .45 + i * .07, t0 + 1.15 + i * .07));
    c.style.transform = `translateY(${(1 - p) * 105}%)`;
  });
}
custom.s1 = (local) => {
  drawLockup(local, mRect, mPeak, $('#s1-word'), 0.15);
  const lock = $('#s1 .lockup');
  const pulse = E.out(prog(local, 1.0, 1.4));
  lock.style.transform = `scale(${1 + 0.03 * Math.sin(pulse * Math.PI)})`;
  const bar = $('#s1-bar');
  bar.style.transform = `scaleX(${E.out5(prog(local, 1.7, 2.4))})`;
  const out = E.in(prog(local, 3.9, 4.5));
  $('#s1 .content').style.transform = `scale(${1 + out * .25})`;
  $('#s1 .content').style.opacity = 1 - out;
};

/* --- S2 --- */
const cardDefs = [
  { x: 1060, y: 110, r: -6, g: ['#2E6BFF', '#0A1E4A'], av: '#2E6BFF', name: 'ui.cA', play: 1 },
  { x: 1430, y: 70,  r: 5,  g: ['#8DB0FF', '#2E6BFF'], av: '#0A1E4A', name: 'ui.cB', play: 0 },
  { x: 1240, y: 520, r: 3,  g: ['#123070', '#4F86FF'], av: '#4F86FF', name: 'ui.cC', play: 0 },
  { x: 1580, y: 470, r: -4, g: ['#0A1E4A', '#8DB0FF'], av: '#2E6BFF', name: 'ui.cA', play: 1 },
];
const cardsHost = $('#s2-cards');
cardDefs.forEach((d, i) => {
  const c = document.createElement('div');
  c.className = 'adcard';
  const x = RTL ? 1920 - d.x - 280 : d.x;
  c.style.left = x + 'px'; c.style.top = d.y + 'px';
  c.innerHTML = `<div class="h"><div class="av" style="background:${d.av}"></div><div><div class="nm">${L[d.name]}</div><div class="sp">${RTL ? 'ממומן' : 'Sponsored'}</div></div></div>
    <div class="media" style="background:linear-gradient(135deg,${d.g[0]},${d.g[1]})">${d.play ? '<div class="play"></div>' : ''}</div>
    <div class="ln" style="width:92%"></div><div class="ln" style="width:64%"></div>
    <div class="cta">${RTL ? 'למידע נוסף' : 'Learn more'}</div><div class="new">${RTL ? 'חדש' : 'NEW'}</div>`;
  cardsHost.appendChild(c);
  d.el = c;
});
custom.s2 = (local, t) => {
  const dim = E.inOut(prog(local, 3.7, 4.3));
  cardDefs.forEach((d, i) => {
    const at = 0.9 + i * 0.42;
    const raw = prog(local, at, at + .55);
    const p = E.back(raw);
    const fl = Math.sin(t * 1.3 + i * 1.7) * 9;
    const drift = -SX * dim * 60;
    d.el.style.opacity = clamp(raw * 3) * (1 - dim * .8);
    d.el.style.transform = `translate(${drift}px, ${fl + (1 - p) * 60}px) rotate(${d.r * (RTL ? -1 : 1)}deg) scale(${lerp(.5, 1, p) * (1 - dim * .12)})`;
    d.el.style.filter = dim > 0 ? `blur(${dim * 6}px)` : '';
    const nw = d.el.querySelector('.new');
    const np = E.back(prog(local, at + .4, at + .8));
    nw.style.transform = `scale(${np})`;
  });
  const h = $('#s2-head');
  h.style.opacity = 1 - dim;
  h.style.transform = `translateY(${-dim * 40}px)`;
  $('#s2-uline').style.transform = `scaleX(${E.out5(prog(local, 4.85, 5.5))})`;
};

/* --- S3 --- */
custom.s3 = (local) => {
  const p = E.out(prog(local, 0.2, 1.6));
  $('#s3-r1').style.transform = `scale(${lerp(.4, 1, p) + local * .01})`;
  $('#s3-r1').style.opacity = p;
  const p2 = E.out(prog(local, 0.5, 2.0));
  $('#s3-r2').style.transform = `scale(${lerp(.4, 1, p2) + local * .008})`;
  $('#s3-r2').style.opacity = p2;
};

/* --- S4 --- */
const steps = [...document.querySelectorAll('#s4 .step')];
const STEP_AT = [1.0, 4.0, 7.0];
let connGeom = null;
function measureConn() {
  // connector paths between card centres (stage coords, measured with no transforms)
  const sr = stage.getBoundingClientRect(), k = sr.width / 1920;
  const rects = steps.map(s => { const tr = s.style.transform; s.style.transform = 'none'; const r = s.getBoundingClientRect(); s.style.transform = tr; return r; });
  const pts = rects.map(r => ({ l: (r.left - sr.left) / k, r: (r.right - sr.left) / k, y: (r.top - sr.top) / k + 205 }));
  const order = RTL ? [...pts].sort((a, b) => b.l - a.l) : [...pts].sort((a, b) => a.l - b.l);
  connGeom = [0, 1].map(i => {
    const a = order[i], b = order[i + 1];
    const x1 = RTL ? a.l - 14 : a.r + 14, x2 = RTL ? b.r + 14 : b.l - 14;
    return { d: `M${x1} ${a.y} L${x2} ${b.y}`, len: Math.hypot(x2 - x1, b.y - a.y) };
  });
  ['#s4-c1', '#s4-c2'].forEach((id, i) => { const p = $(id); p.setAttribute('d', connGeom[i].d); p.dataset.len = connGeom[i].len; p.style.strokeDasharray = p.dataset.len; });
}
custom.s4 = (local, t) => {
  if (!connGeom) measureConn();
  ['#s4-c1', '#s4-c2'].forEach((id, i) => {
    const p = $(id), len = +p.dataset.len;
    p.style.strokeDashoffset = len * (1 - E.inOut(prog(local, STEP_AT[i + 1] - .55, STEP_AT[i + 1] - .05)));
  });
  steps.forEach((s, i) => {
    const on = prog(local, STEP_AT[i] + .2, STEP_AT[i] + .6) - (i < 2 ? prog(local, STEP_AT[i + 1], STEP_AT[i + 1] + .4) : 0);
    s.querySelector('.ring').style.opacity = on;
    const base = s.style.transform || '';
    s.style.transform = base + ` scale(${1 + on * .045})`;
  });
  $('#s4-sweep').setAttribute('transform', `rotate(${(t * 220) % 360} 12 12)`);
};

/* --- S5 dashboard --- */
const inName = $('#in-name'), inUrl = $('#in-url'), btnRun = $('#btn-run'), badge = $('#badge'), badgeT = $('#badge-t');
const lastRun = $('#last-run'), pbar = $('#pbar'), scan = $('#scan'), compNew = $('#comp-new'), compTitle = $('#comp-title');
const cursor = $('#cursor'), ripple = $('#ripple'), browser = $('#browser');
const histBody = $('#hist-body');
const histRows = [
  { d: 'ui.dNew', c: 'ui.cC', n: 6, nw: 1 }, { d: 'ui.dNew', c: 'ui.cB', n: 9, nw: 1 }, { d: 'ui.dNew', c: 'ui.cA', n: 14, nw: 1 },
  { d: 'ui.dOld', c: 'ui.cB', n: 8 }, { d: 'ui.dOld', c: 'ui.cA', n: 12 },
];
histRows.forEach((r, i) => {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${L[r.d]}</td><td><b>${L[r.c]}</b></td><td class="n">${r.n}</td><td><span class="badge ok"><span class="dot"></span>${L['ui.ok']}</span></td>`;
  histBody.appendChild(tr);
  r.el = tr;
  if (r.nw) tr.id = 'hist-row-' + i;
});
let compNewH = 0;
function typed(str, local, a, b) {
  const chars = [...str];
  const n = Math.round(chars.length * prog(local, a, b));
  return chars.slice(0, n).join('');
}
function caret(t) { return (Math.floor(t * 2.2) % 2 === 0) ? '<span class="caret"></span>' : '<span class="caret" style="opacity:0"></span>'; }
function inputHTML(val, ph, focused, t, ltr) {
  const d = ltr ? ' dir="ltr" style="unicode-bidi:isolate"' : '';
  if (!val) return (focused ? caret(t) : '') + `<span class="ph">${ph}</span>`;
  return `<span${d}>${val}</span>` + (focused ? caret(t) : '');
}
const CLICKS = [2.0, 3.95, 5.8, 7.6];
const PATH = [
  { t: 1.2, at: () => ptIn(browser, .55, .92) }, { t: 2.0, at: () => ptIn(inName, .35, .55) },
  { t: 3.4, at: () => ptIn(inName, .35, .55) }, { t: 3.95, at: () => ptIn(inUrl, .4, .55) },
  { t: 5.2, at: () => ptIn(inUrl, .4, .55) }, { t: 5.8, at: () => ptIn($('#btn-add'), .5, .55) },
  { t: 6.8, at: () => ptIn($('#btn-add'), .5, .55) }, { t: 7.6, at: () => ptIn(btnRun, .5, .55) },
  { t: 12.4, at: () => ptIn(btnRun, .5, .55) }, { t: 13.3, at: () => ptIn($('#hist-row-0'), .55, .5) },
];
function ptIn(el, fx, fy) {
  const sr = stage.getBoundingClientRect(), k = sr.width / 1920, r = el.getBoundingClientRect();
  return { x: (r.left - sr.left + r.width * fx) / k, y: (r.top - sr.top + r.height * fy) / k };
}
custom.s5 = (local, t) => {
  if (!compNewH) { compNew.style.height = 'auto'; compNewH = compNew.scrollHeight; }
  // inputs
  const fName = local >= 2.0 && local < 3.95, fUrl = local >= 3.95 && local < 5.8;
  const cleared = local >= 5.9;
  const nameV = cleared ? '' : typed(L['ui.typeName'], local, 2.15, 3.2);
  const urlV = cleared ? '' : typed(L['ui.typeUrl'], local, 4.05, 5.05);
  inName.classList.toggle('focus', fName); inUrl.classList.toggle('focus', fUrl);
  inName.innerHTML = inputHTML(nameV, L['ui.phName'], fName, t, false);
  inUrl.innerHTML = inputHTML(urlV, L['ui.phUrl'], fUrl, t, true);
  // new competitor row
  const rp = E.out(prog(local, 5.9, 6.35));
  compNew.style.height = (compNewH * rp) + 'px';
  compNew.style.opacity = rp;
  compNew.firstElementChild.style.background = `rgba(46,107,255,${0.12 * (1 - prog(local, 6.4, 7.6))})`;
  compTitle.textContent = `${L['ui.comps']} (${local >= 5.9 ? 3 : 2})`;
  // agent run
  const running = local >= 7.6 && local < 11.6;
  const done = local >= 11.6;
  btnRun.textContent = running ? L['ui.running'] : L['ui.runBtn'];
  btnRun.style.opacity = running ? .55 : 1;
  btnRun.style.transform = `scale(${1 - .06 * Math.sin(Math.PI * prog(local, 7.55, 7.8))})`;
  badge.className = 'badge ' + (running ? 'run' : 'ok');
  badgeT.textContent = running ? L['ui.active'] : L['ui.success'];
  badge.querySelector('.dot').style.opacity = running ? (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 9))) : 1;
  lastRun.textContent = done ? L['ui.lastNew'] : L['ui.lastOld'];
  lastRun.style.direction = 'ltr';
  const pp = prog(local, 7.7, 11.3);
  pbar.style.width = (running || done ? E.inOut(pp) * 100 : 0) + '%';
  pbar.style.opacity = done ? 1 - prog(local, 12.4, 12.8) : 1;
  let sc = '';
  if (local >= 7.7 && local < 10.4) {
    const which = ['ui.cA', 'ui.cB', 'ui.cC'][Math.min(2, Math.floor((local - 7.7) / 0.9))];
    sc = `${L['ui.scanning']} ${L[which]}…`;
  } else if (local >= 10.4 && local < 11.6) sc = L['ui.analyzing'];
  else if (done) sc = `<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span style="color:#0E9A5B">${L['ui.sent']}</span>`;
  scan.innerHTML = sc;
  // history rows
  histRows.forEach((r, i) => {
    if (r.nw) {
      const at = 11.9 + (2 - i) * .22;
      const p = E.out(prog(local, at, at + .4));
      r.el.style.display = p > 0 ? '' : 'none';
      r.el.style.opacity = p;
      r.el.style.transform = `translateX(${-SX * (1 - p) * 40}px)`;
      r.el.classList.toggle('hl', local > at && local < 15.5);
    }
  });
  // captions focus
  ['#cap0', '#cap1', '#cap2'].forEach((id, i) => {
    const on = [0, 6.6, 11.8][i], off = [6.6, 11.8, 99][i];
    const f = prog(local, on, on + .3) - prog(local, off, off + .3) * .65;
    $(id).querySelector('.tx').style.opacity = .35 + .65 * clamp(f);
    $(id).querySelector('.no').style.background = f > .5 ? 'var(--b500)' : 'rgba(46,107,255,.3)';
  });
  // gentle camera push at the end
  const cam = E.inOut(prog(local, 13.4, 17.6));
  $('#s5 .split').style.transform = `scale(${1 + cam * .035})`;
  // cursor
  const vis = local >= 1.2 && local < 15.2;
  cursor.style.display = vis ? 'block' : 'none';
  ripple.style.display = 'none';
  if (vis) {
    let pos = PATH[0].at();
    for (let i = 0; i < PATH.length - 1; i++) {
      const a = PATH[i], b = PATH[i + 1];
      if (local >= a.t && local <= b.t) { const p = E.inOut(prog(local, a.t, b.t)); const A = a.at(), B = b.at(); pos = { x: lerp(A.x, B.x, p), y: lerp(A.y, B.y, p) }; break; }
      if (local > b.t) pos = b.at();
    }
    const appear = E.out(prog(local, 1.2, 1.5)) * (1 - prog(local, 14.8, 15.2));
    let press = 0;
    CLICKS.forEach(c => { press = Math.max(press, Math.sin(Math.PI * prog(local, c - .05, c + .15))); });
    cursor.style.opacity = appear;
    cursor.style.transform = `translate(${pos.x - 8}px, ${pos.y - 4}px) scale(${1 - press * .18})`;
    cursor.style.transformOrigin = '8px 4px';
    CLICKS.forEach(c => {
      const rp = prog(local, c, c + .45);
      if (rp > 0 && rp < 1) {
        ripple.style.display = 'block';
        ripple.style.left = pos.x + 'px'; ripple.style.top = pos.y + 'px';
        ripple.style.transform = `scale(${lerp(.3, 1.3, E.out(rp))})`;
        ripple.style.opacity = 1 - rp;
      }
    });
  }
};

/* --- S6 report --- */
const secs = [...document.querySelectorAll('#bubble .sec')];
const SEC_AT = [1.75, 2.2, 4.3, 6.4, 8.5];
let secH = null;
custom.s6 = (local, t) => {
  if (!secH) secH = secs.map(s => { s.style.height = 'auto'; return s.scrollHeight; });
  const ph = $('#phone');
  const pp = E.out(prog(local, 0.1, 0.9));
  ph.style.transform = `translateY(${(1 - pp) * 260}px) rotate(${(1 - pp) * SX * -6}deg)`;
  ph.style.opacity = clamp(pp * 2);
  const typing = $('#typing');
  typing.style.display = local >= 0.8 && local < 1.7 ? 'inline-flex' : 'none';
  [...typing.children].forEach((d, i) => d.style.transform = `translateY(${Math.sin(t * 10 - i * .9) * 3}px)`);
  const bub = $('#bubble');
  const bp = E.back(prog(local, 1.7, 2.1));
  bub.style.display = local >= 1.7 ? 'block' : 'none';
  bub.style.transform = `scale(${lerp(.85, 1, bp)})`;
  bub.style.transformOrigin = RTL ? 'top right' : 'top left';
  secs.forEach((s, i) => {
    const p = E.out(prog(local, SEC_AT[i], SEC_AT[i] + .45));
    s.style.height = secH[i] * p + 'px';
    s.style.opacity = p;
    const hl = i > 0 ? clamp(prog(local, SEC_AT[i], SEC_AT[i] + .3) - prog(local, SEC_AT[i] + 1.8, SEC_AT[i] + 2.1)) : 0;
    s.firstElementChild.style.background = `rgba(46,107,255,${hl * .12})`;
  });
  ['#rc0', '#rc1', '#rc2', '#rc3'].forEach((id, i) => {
    const at = SEC_AT[i + 1];
    const f = clamp(prog(local, at, at + .3) - prog(local, at + 2.1, at + 2.4) * .5);
    const el = $(id);
    el.querySelector('.no').style.background = `rgba(46,107,255,${.2 + .8 * (f > .55 ? 1 : 0)})`;
    el.querySelector('.no').style.color = f > .55 ? '#fff' : 'var(--b300)';
  });
};

/* --- S7 --- */
custom.s7 = () => {};

/* --- S8 --- */
custom.s8 = (local, t) => {
  drawLockup(local, $('#m2-rect'), $('#m2-peak'), $('#s8-word'), 0.2);
  const end = prog(local, 5.3, 6.0);
  $('#fadeout').style.opacity = E.inOut(end);
};

/* ============ master render ============ */
function renderAt(t) {
  t = clamp(t, 0, DUR - 1e-4);
  scenes.forEach((s, i) => {
    const next = scenes[i + 1];
    const visEnd = next ? s.end + WIPE : DUR;
    const vis = t >= s.start && t < visEnd;
    s.el.style.display = vis ? 'block' : 'none';
    if (!vis) return;
    const local = t - s.start;
    // wipe in (every scene after the first)
    if (i > 0) {
      const w = E.inOut(prog(local, 0, WIPE));
      const cut = (1 - w) * 100;
      s.el.style.clipPath = w >= 1 ? 'none' : (RTL ? `inset(0 ${cut}% 0 0)` : `inset(0 0 0 ${cut}%)`);
      s.edge.style.display = w > 0 && w < 1 ? 'block' : 'none';
      const ex = (cut / 100) * 1920;
      s.edge.style.left = (RTL ? 1920 - ex - 18 : ex) + 'px';
    }
    bgMotion(s, t);
    s.ins.forEach(({ n, at, fx }) => applyFx(n, at, fx, local));
    const fn = custom[s.el.id];
    if (fn) { try { fn(local, t); } catch (e) { console.error(s.el.id, e.message, e.stack); } }
  });
  $('#progress').style.width = (t / DUR * 100) + '%';
  if (t < 66.9) $('#fadeout').style.opacity = 0;
}
window.renderAt = renderAt;
window.DUR = DUR; window.FPS = FPS;

/* ============ preview player ============ */
function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `scale(${k})`;
}
window.addEventListener('resize', fit);
window.ready = document.fonts.ready.then(() => { fit(); renderAt(0); return true; });
if (!Q.has('render')) {
  let t0 = null, paused = false, cur = +(Q.get('t') || 0);
  const loop = now => {
    if (t0 === null) t0 = now - cur * 1000;
    if (!paused) { cur = ((now - t0) / 1000) % DUR; renderAt(cur); }
    requestAnimationFrame(loop);
  };
  window.ready.then(() => requestAnimationFrame(loop));
  addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; if (!paused) t0 = performance.now() - cur * 1000; }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { cur = clamp(cur + (e.code === 'ArrowRight' ? 2 : -2), 0, DUR); t0 = performance.now() - cur * 1000; renderAt(cur); }
  });
  stage.addEventListener('click', e => { const r = stage.getBoundingClientRect(); cur = (e.clientX - r.left) / r.width * DUR; t0 = performance.now() - cur * 1000; });
}
</script>
